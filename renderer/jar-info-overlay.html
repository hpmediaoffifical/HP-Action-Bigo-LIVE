<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>HP Action - Quà kích hoạt</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; -webkit-font-smoothing: antialiased; }
    /* Danh sách neo góc trên-trái của Browser Source, luôn nhất quán dù OBS đặt cỡ nào. */
    #list { position: fixed; left: 24px; top: 24px; display: flex; flex-direction: column; gap: 12px; }
    .info-item {
      display: flex; align-items: center; gap: 14px;
      background: rgba(60, 66, 78, 0.42);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 18px; padding: 10px 22px 10px 10px;
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }
    .info-item img.gift { width: 72px; height: 72px; border-radius: 14px; object-fit: contain; background: rgba(0,0,0,0.25); flex: 0 0 72px; }
    .info-text { display: flex; flex-direction: column; gap: 2px; }
    .info-name { color: #fff; font: 800 30px "Segoe UI", sans-serif; text-shadow: 0 2px 6px rgba(0,0,0,0.7); white-space: nowrap; }
    .info-fx { color: #ffd166; font: 700 22px "Segoe UI", sans-serif; text-shadow: 0 2px 6px rgba(0,0,0,0.7); }
  </style>
</head>
<body>
  <div id="list"></div>
  <script src="/jar-info.js"></script>
</body>
</html>
